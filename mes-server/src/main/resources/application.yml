spring:
  application:
    name: mini-mes-server

  datasource:
    url: jdbc:postgresql://localhost:5432/minimes
    username: minimes
    password: minimes

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway가 만들고, 엔티티와 어긋나면 기동 실패
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: debug
