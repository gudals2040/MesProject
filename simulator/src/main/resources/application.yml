spring:
  application:
    name: mini-mes-simulator
  main:
    web-application-type: none   # 웹 서버 없이 스케줄러만 동작

simulator:
  server-url: http://localhost:8080
  # 수집 API 경로는 2단계 3번(서버 수집 API)에서 확정한다
  sensor-path: /api/collection/sensor-readings
  status-path: /api/collection/status-changes
  interval: PT5S
  equipments: [EQ-01, EQ-02, EQ-03]
  anomaly-rate: 0.02       # 주기마다 이상값을 섞을 확률
  duplicate-rate: 0.0      # 중복 수신 테스트 때만 올린다 (예: 0.3)
  transition:              # 주기마다 상태가 바뀔 확률
    run-to-idle: 0.02
    run-to-down: 0.01
    idle-to-run: 0.15
    idle-to-down: 0.01
    down-to-run: 0.08

logging:
  level:
    com.minimes.simulator: debug
